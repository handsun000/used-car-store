spring:
  application:
    name: mycar-market-backend
  config:
    import: optional:classpath:application-secret.yml
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  profiles:
    active: prod

server:
  port: ${PORT:8080}

jwt:
  expiration: 86400000 # 1 day

file:
  upload-dir: uploads

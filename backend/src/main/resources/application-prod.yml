spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

# CORS for Production (can be overridden by env vars if needed)
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://used-car-store.vercel.app,https://gencar.co.kr,https://www.gencar.co.kr}

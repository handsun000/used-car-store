spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

app:
  cors:
    allowed-origins: http://localhost:3000

jwt:
  secret: dummy_secret_key_for_local_development_replace_this_with_a_secure_one

cloudinary:
  cloud-name: dummy
  api-key: dummy
  api-secret: dummy

